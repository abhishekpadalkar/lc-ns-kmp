[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.12",
  "numpy",
]
build-backend = "scikit_build_core.build"

[project]
name = "lc-ns-kmp"
version = "0.1.0"
description = "Linearly Constrained Null-Space Kernelized Movement Primitives"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Abhishek Padalkar" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["matplotlib>=3.7", "scikit-learn>=1.3", "jupyter>=1.0"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/lc_ns_kmp"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
LC_NS_KMP_BUILD_PYTHON = "ON"
