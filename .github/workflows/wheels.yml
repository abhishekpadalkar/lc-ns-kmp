name: Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install -U pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_wheels_linux:
    name: Wheels (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cibuildwheel
        run: python -m pip install -U cibuildwheel
      - name: Build wheels
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "pp* *-musllinux_* *_i686"
          CIBW_ARCHS: x86_64
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-linux
          path: wheelhouse/*.whl

  build_wheels_macos:
    name: Wheels (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenMP (required by Apple Clang builds)
        run: brew install libomp
      - name: Install cibuildwheel
        run: python -m pip install -U cibuildwheel
      - name: Build wheels
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "pp* *-musllinux_*"
          # macos-14 runners are arm64; avoid slow/broken x86_64 cross-builds for now
          CIBW_ARCHS: arm64
          # Homebrew libomp is built for macOS 14+; deployment target must match.
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          OpenMP_ROOT: /opt/homebrew/opt/libomp
          CMAKE_PREFIX_PATH: /opt/homebrew/opt/libomp
          LDFLAGS: -L/opt/homebrew/opt/libomp/lib
          CPPFLAGS: -I/opt/homebrew/opt/libomp/include
          CIBW_ENVIRONMENT: >
            MACOSX_DEPLOYMENT_TARGET=14.0
            OpenMP_ROOT=/opt/homebrew/opt/libomp
            CMAKE_PREFIX_PATH=/opt/homebrew/opt/libomp
            LDFLAGS=-L/opt/homebrew/opt/libomp/lib
            CPPFLAGS=-I/opt/homebrew/opt/libomp/include
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-macos
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    # Require sdist + Linux wheels. macOS is best-effort so a mac-only
    # failure does not block a Linux PyPI release.
    needs: [build_sdist, build_wheels_linux, build_wheels_macos]
    runs-on: ubuntu-latest
    if: >
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build_sdist.result == 'success' &&
      needs.build_wheels_linux.result == 'success'
    environment:
      name: pypi
      url: https://pypi.org/p/lc-ns-kmp
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish_testpypi:
    name: Publish to TestPyPI
    needs: [build_sdist, build_wheels_linux, build_wheels_macos]
    runs-on: ubuntu-latest
    if: >
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.build_sdist.result == 'success' &&
      needs.build_wheels_linux.result == 'success'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lc-ns-kmp
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
